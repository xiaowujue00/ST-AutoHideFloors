<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<title>Auto Hide Floors test harness</title>
<style>
    body { margin: 0; background: #1f1f1f; color: #ddd; font-family: system-ui, "Segoe UI", sans-serif; }
    #sheld { display: flex; flex-direction: column; height: 100vh; width: 760px; margin: 0 auto; }
    #chat {
        display: flex; flex-direction: column; flex: 1; overflow-y: scroll;
        background: #262626; padding: 8px; gap: 8px;
        --SmartThemeBodyColor: #ddd;
        --SmartThemeBorderColor: #555;
        --SmartThemeBlurTintColor: rgba(40, 40, 40, .92);
        --SmartThemeBlurStrength: 8px;
        --mainFontSize: 15px;
    }
    .mes { border: 1px solid #3a3a3a; border-radius: 8px; padding: 6px 10px; background: #2e2e2e; }
    .mes_text { margin: 0; }
    #show_more_messages { text-align: center; padding: 4px; color: #888; }
    #extensions_settings { width: 360px; margin: 20px auto; background: #2a2a2a; padding: 10px; }
</style>
</head>
<body>
<div id="sheld">
    <div id="chat"></div>
</div>
<div id="extensions_settings"></div>
<script>
    const chat = [];
    const listeners = new Map();
    const saved = { count: 0, chatCount: 0 };
    const eventTypes = {};
    const names = [
        'APP_READY', 'CHAT_CHANGED', 'CHAT_LOADED', 'MESSAGE_SENT', 'MESSAGE_RECEIVED',
        'MESSAGE_EDITED', 'MESSAGE_DELETED', 'MESSAGE_SWIPED', 'MESSAGE_UPDATED',
        'MORE_MESSAGES_LOADED', 'GENERATION_ENDED',
        'GENERATION_AFTER_COMMANDS', 'GENERATE_AFTER_DATA', 'CHAT_COMPLETION_PROMPT_READY',
        'GENERATION_STOPPED', 'GROUP_MEMBER_DRAFTED', 'GROUP_WRAPPER_FINISHED'
    ];
    for (const name of names) eventTypes[name] = name;

    const context = {
        chat,
        characterId: 0,
        groupId: undefined,
        chatId: 'test-chat',
        extensionSettings: {},
        eventTypes,
        eventSource: {
            on(type, callback) {
                if (!listeners.has(type)) listeners.set(type, []);
                listeners.get(type).push(callback);
            },
            emit(type, ...args) {
                for (const callback of listeners.get(type) ?? []) callback(...args);
            },
        },
        saveSettingsDebounced() { saved.count++; },
        saveChat() { saved.chatCount++; return Promise.resolve(); },
        scrollChatToBottom() {},
        SlashCommandParser: {
            addCommandObject(command) { window.__test.command = command; },
        },
        SlashCommand: { fromProps(props) { return props; } },
        SlashCommandArgument: { fromProps(props) { return props; } },
        ARGUMENT_TYPE: { STRING: 'string' },
        async renderExtensionTemplateAsync(_path, name) {
            const response = await fetch(`../${name}.html`);
            return response.text();
        },
    };
    window.SillyTavern = { getContext: () => context };
    window.__test = { chat, saved, listeners, context };

    const chatEl = document.getElementById('chat');
    function renderMessage(index) {
        const message = chat[index];
        const node = document.createElement('div');
        node.className = 'mes';
        node.setAttribute('mesid', String(index));
        node.setAttribute('is_user', String(!!message.is_user));
        node.setAttribute('is_system', String(!!message.is_system));
        node.innerHTML = `<div class="ch_name">${message.name}</div><div class="mes_text">${message.mes}</div>`;
        chatEl.appendChild(node);
        return node;
    }

    for (let i = 0; i < 25; i++) {
        chat.push({
            name: i % 2 === 0 ? 'User' : 'AI',
            mes: `第 ${i} 层消息`,
            is_user: i % 2 === 0,
            is_system: false,
            extra: {},
        });
        renderMessage(i);
    }
</script>
<script type="module" src="../index.js"></script>
</body>
</html>
